<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(circle at top, #ffd1dc, #fff);
      color:#1f1f1f;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(560px, 100%);
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      border-radius: 24px;
      padding: 28px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{ font-size: 34px; margin: 6px 0 10px; }
    p{ font-size: 16px; line-height:1.5; margin: 0 0 18px; opacity:0.9; }
    .btns{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
    button{
      border:0;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 16px;
      cursor:pointer;
      transition: transform .08s ease, box-shadow .2s ease;
      min-width: 150px;
    }
    button:active{ transform: scale(0.98); }
    .yes{
      background:#ff2e63;
      color:white;
      box-shadow: 0 10px 24px rgba(255,46,99,0.25);
    }
    .no{
      background:#f3f4f6;
      color:#111;
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
      position:relative;
    }
    .pill{
      display:inline-block;
      font-size: 13px;
      background: rgba(255,46,99,0.12);
      color:#b0002a;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      font-weight:600;
    }
    .result{
      margin-top:16px;
      padding: 14px 14px;
      background: rgba(0,0,0,0.04);
      border-radius: 14px;
      display:none;
    }
    .confetti{
      position:absolute;
      inset:-60px;
      background-image:
        radial-gradient(#ff2e63 2px, transparent 3px),
        radial-gradient(#ffcc00 2px, transparent 3px),
        radial-gradient(#7c3aed 2px, transparent 3px),
        radial-gradient(#22c55e 2px, transparent 3px);
      background-size: 60px 60px;
      background-position: 0 0, 10px 20px, 30px 10px, 40px 30px;
      opacity:0;
      transform: rotate(8deg);
      transition: opacity .4s ease;
      pointer-events:none;
    }
    .confetti.on{ opacity:0.22; }
    .small{
      font-size: 13px;
      opacity: 0.75;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="confetti" id="confetti"></div>

    <div class="pill">💘 A message from Anirudh</div>
    <h1>Aakriti, will you be my Valentine?</h1>
    <p>
     I was overthinking this, but it is simple:
      I love you and I want this day to be ours, 
    </p>

    <div class="btns">
      <button class="yes" id="yesBtn">Yes 💖</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <div class="result" id="resultBox"></div>
    <div class="small">Tip: Use your laptop to do this 😉 </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const resultBox = document.getElementById("resultBox");
    const confetti = document.getElementById("confetti");

    yesBtn.addEventListener("click", () => {
      confetti.classList.add("on");
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <h2 style="margin:0 0 6px;"> Toh deal pakki hui </h2>
        <p style="margin:0;">
          Okay it’s official. You’re my Valentine. <br/>
          Be ready by 7, Ill pick you up. 
        </p>
      `;
    });

    // playful "no" button that dodges the cursor/tap
    function moveNoButton() {
      const dx = (Math.random() * 220) - 110;
      const dy = (Math.random() * 140) - 70;
      noBtn.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", () => {
      moveNoButton();
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <p style="margin:0;">
          That button is decorative 😭<br/>
          Try the other one.
        </p>
      `;
    });
  </script>
</body>
</html>
